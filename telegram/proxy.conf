# Upstream route this plugin needs, spliced into core's nginx server block by
# run-plugin when core does not already carry it.
#
# Telegram serves API calls from /bot<token>/ and files from /file/bot<token>/.
# Core routes the first; this routes the second, which is what every inbound
# photo, document and voice note is fetched through. Without it the plugin's
# TelegramAPIServer file base has nowhere to land and media downloads 404 while
# text keeps working.
#
# Only the file route is here on purpose: core already defines location
# /telegram/, and nginx refuses a duplicate location in one server block.
location /telegram-file/ {
    rewrite ^/telegram-file/(.*)$ /file/bot${TG_BOT_TOKEN}/$1 break;
    proxy_pass https://api.telegram.org;
    proxy_set_header Host api.telegram.org;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_http_version 1.1;
}
