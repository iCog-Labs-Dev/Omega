profile_name: telegram_mode_v1
description: >
  Telegram-only Omega profile. The model may call only the skills an enabled
  callable capability grants; the plugin refuses every other skill, and refuses
  to start on a profile holding a key it does not act on.

telegram:
  reply_only_when_directly_tagged: true
  reply_on_reply_to_bot: true
  restrict_to_config_chat: true
  allowed_chats:
      -
  allow_group_bots: true

  dm_support:
    enabled: false
  reply_constraints:
    allow_files: true
    allow_media: true
    allow_audio: true
    allow_image_generation: true
    allow_pdf_generation: true
    # install-pdf-font: lets the agent add fonts for scripts PDFs cannot draw
    # yet. Downloads come only from the OFL folder of github.com/google/fonts,
    # by family name, and are size-capped; the agent never supplies a URL.
    allow_pdf_font_install: true
    allow_voice_reply: true

admin_controls:
  admin_ids: [] # Add authorized admin Telegram IDs here

classification_model:
  name: "gpt-4o-mini"

spam_protection:
  time_window: 10
  message_limit: 5
  cooldown_duration: 120
  admin_alert_threshold: 3

ethics_pass:
  blocked_categories:
    - child_sexual_content
    - nonconsensual_sexual_content
    - fraud_or_scam_enablement
    - credential_theft_or_phishing
    - malware_or_hacking_enablement
    - doxxing_or_private_data_lookup
    - stalking_or_invasive_surveillance
    - violent_wrongdoing_or_terror_enablement
    - hateful_targeted_abuse
    - self_harm_or_harm_instructions
    - safeguard_bypass_requests

# The skills the model may call. Each enabled capability grants the skills it
# lists; when the channel starts, every other skill is refused, including the
# shell, file reads and writes, MeTTa evaluation, and any skill core or another
# plugin adds later. same_chat_only keeps a send to the chat being answered.
callable_capabilities:
  telegram_reply:
    enabled: true
    skills: [send]
    constraints:
      - same_chat_only
  safe_search_lookup:
    enabled: true
    skills: [websearch]
  image_understanding:
    enabled: true
    skills: [describe-image]
  image_generation:
    enabled: true
    skills: [generate-image]
  pdf_generation:
    enabled: true
    skills: [generate-pdf, install-pdf-font]
  voice_reply:
    enabled: true
    skills: [speak]
  working_memory:
    enabled: true
    skills: [pin, remember, query, episodes]
  version_report:
    enabled: true
    skills: [version]
