name: release

# Core's own releases are tagged v<version>. The Telegram bot publishes its
# release notes here too, because it reads them anonymously and the repository
# that deploys it is private, and those releases fired this workflow as well:
# a full core build and the arm64 autotests, for notes that ship no core.
on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/common.yml
    with:
      publish_docker: true
      tag_name: ${{ github.sha }}
      move_latest: false
    secrets: inherit

  update-tags:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dockerhub-production

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Update release tags
        run: |
          docker buildx imagetools create \
            -t singularitynet/omega:${{ github.event.release.tag_name }} \
            -t singularitynet/omega:latest \
            singularitynet/omega:${{ github.sha }}
